version: '3.8'

services:
  adverse-event-ctcae-v5-triage:
    build: .
    container_name: adverse-event-ctcae-v5-triage
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=adverse-event-ctcae-v5-triage-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
