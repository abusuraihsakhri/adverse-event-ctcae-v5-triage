name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build static site
        run: |
          set -euo pipefail
          mkdir -p _site/pyodide
          cp web/index.html web/styles.css web/app.js web/worker.js _site/
          cp ctcae_triager/__init__.py _site/engine.py

          pyodide_base="https://cdn.jsdelivr.net/pyodide/v314.0.7/full"
          for asset in \
            pyodide.js \
            pyodide.mjs \
            pyodide.asm.mjs \
            pyodide.asm.wasm \
            pyodide-lock.json \
            python_stdlib.zip
          do
            curl --fail --silent --show-error --location \
              "${pyodide_base}/${asset}" \
              --output "_site/pyodide/${asset}"
            test -s "_site/pyodide/${asset}"
          done

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Verify deployed files
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"

          ok=false
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location "${base}" --output /tmp/index.html; then
              ok=true
              break
            fi
            sleep 5
          done
          test "${ok}" = true

          grep -q 'id="analyzeButton"' /tmp/index.html
          for asset in styles.css app.js worker.js engine.py; do
            curl --fail --silent --show-error --location "${base}${asset}" --output "/tmp/${asset}"
            test -s "/tmp/${asset}"
          done
          grep -q 'PYODIDE_BASE = "pyodide/"' /tmp/worker.js
          grep -q 'class CTCAETriageEngine' /tmp/engine.py

          for asset in pyodide.js pyodide.asm.mjs pyodide.asm.wasm pyodide-lock.json python_stdlib.zip; do
            curl --fail --silent --show-error --location \
              "${base}pyodide/${asset}" \
              --output "/tmp/pyodide-${asset}"
            test -s "/tmp/pyodide-${asset}"
          done

      - name: Verify browser Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet selenium

          python - <<'PY'
          import os
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          page_url = os.environ["PAGE_URL"].rstrip("/") + "/?smoke=1"

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-gpu")
          options.add_argument("--disable-dev-shm-usage")
          options.set_capability("goog:loggingPrefs", {"browser": "ALL"})

          driver = webdriver.Chrome(options=options)
          try:
              driver.get(page_url)
              wait = WebDriverWait(driver, 90, poll_frequency=0.5)
              wait.until(
                  lambda d: d.find_element(By.TAG_NAME, "html").get_attribute("data-smoke")
                  in {"pass", "fail"}
              )

              state = driver.find_element(By.TAG_NAME, "html").get_attribute("data-smoke")
              runtime_status = driver.find_element(By.ID, "runtimeStatus").text
              error_text = driver.find_element(By.ID, "formError").text
              grade_text = driver.find_element(By.ID, "gradeBadge").text
              browser_logs = driver.get_log("browser")

              print(f"Smoke state: {state}")
              print(f"Runtime status: {runtime_status}")
              print(f"Grade result: {grade_text}")
              if error_text:
                  print(f"Page error: {error_text}")
              for entry in browser_logs:
                  print(f"Browser log [{entry['level']}]: {entry['message']}")

              if state != "pass":
                  raise AssertionError("Deployed browser Python smoke test did not pass.")
              if "Grade 4" not in grade_text:
                  raise AssertionError(f"Unexpected deployed grading result: {grade_text}")
          finally:
              driver.quit()
          PY
